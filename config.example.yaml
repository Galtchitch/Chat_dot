# netmon — конфигурация мониторинга узлов локальной сети.
#
# Скопируйте файл: copy config.example.yaml config.yaml  (Windows)
#                  cp config.example.yaml config.yaml     (Linux/macOS)

telegram:
  # Токен лучше держать в .env (TELEGRAM_BOT_TOKEN=...), тогда здесь оставьте пустым.
  token: ""
  # Свой (локальный) сервер Telegram Bot API, если он развёрнут в вашей сети.
  # Например: http://192.168.1.10:8081
  # Оставьте пустым, чтобы работать через api.telegram.org.
  api_base: ""
  # ID пользователей, которым разрешено менять список узлов. Узнать свой ID: /id
  # Если список пуст, изменять узлы может любой подписчик (удобно для быстрого старта).
  admin_ids: []
  # Набор доверенных сертификатов. Нужен, если TLS инспектирует корпоративный
  # прокси (Kaspersky, Zscaler и т. п.): иначе будет CERTIFICATE_VERIFY_FAILED.
  #   "auto"  — собрать из хранилища Windows при запуске в certs/ca-bundle.pem
  #   "путь"  — готовый PEM-файл
  #   ""      — использовать стандартный набор certifi
  ca_bundle: ""

monitor:
  default_interval: 60      # как часто проверять узлы, секунды
  timeout: 3                # таймаут одной проверки, секунды
  workers: 32               # сколько проверок выполнять параллельно
  flap_threshold: 2         # сколько неудач подряд до оповещения «недоступен»
  down_repeat_minutes: 30   # напоминать о недоступном узле каждые N минут (0 — не напоминать)

# Окно уведомлений. Вне него события копятся и приходят одной сводкой в начале окна.
notify:
  window: "07:00-22:30"     # пусто или "always" — уведомлять круглосуточно
  timezone: ""              # например, Europe/Moscow; пусто — время сервера

# Параметры сканирования подсетей (/scan, netmon scan).
scan:
  timeout: 1                # таймаут отклика при сканировании, секунды
  workers: 256              # сколько адресов проверять параллельно
  max_hosts: 4096           # предохранитель для очень больших подсетей
  resolve_names: true       # определять имена узлов (обратный DNS, затем NetBIOS)
  name_timeout: 2           # таймаут определения одного имени, секунды

# Сети, к которым относится бот. Используются для группировки и сканирования.
networks:
  - name: "Сеть 124"
    cidr: 192.168.124.0/24
  - name: "Сеть 147"
    cidr: 192.168.147.0/24

# Узлы добавляются в базу при первом запуске.
# Поле network необязательно: если не указать, сеть определится по адресу.
hosts:
  - name: gw-124
    address: 192.168.124.1
    network: "Сеть 124"
  - name: nas-124
    address: 192.168.124.10
    kind: tcp
    port: 445
    network: "Сеть 124"
  - name: gw-147
    address: 192.168.147.1
    network: "Сеть 147"
  - name: web-147
    address: 192.168.147.20
    kind: http
    port: 8080
    interval: 120
    network: "Сеть 147"

database: data/netmon.sqlite3
